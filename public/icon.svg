<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg-grad)"/>
  <!-- Brain/neural network nodes -->
  <!-- Central node -->
  <circle cx="256" cy="240" r="28" fill="white" opacity="0.95"/>
  <!-- Surrounding nodes -->
  <circle cx="160" cy="180" r="18" fill="white" opacity="0.8"/>
  <circle cx="352" cy="180" r="18" fill="white" opacity="0.8"/>
  <circle cx="160" cy="300" r="18" fill="white" opacity="0.8"/>
  <circle cx="352" cy="300" r="18" fill="white" opacity="0.8"/>
  <circle cx="256" cy="140" r="14" fill="white" opacity="0.7"/>
  <circle cx="200" cy="340" r="14" fill="white" opacity="0.7"/>
  <circle cx="312" cy="340" r="14" fill="white" opacity="0.7"/>
  <!-- Connection lines -->
  <line x1="256" y1="240" x2="160" y2="180" stroke="white" stroke-width="4" opacity="0.5"/>
  <line x1="256" y1="240" x2="352" y2="180" stroke="white" stroke-width="4" opacity="0.5"/>
  <line x1="256" y1="240" x2="160" y2="300" stroke="white" stroke-width="4" opacity="0.5"/>
  <line x1="256" y1="240" x2="352" y2="300" stroke="white" stroke-width="4" opacity="0.5"/>
  <line x1="256" y1="240" x2="256" y2="140" stroke="white" stroke-width="4" opacity="0.5"/>
  <line x1="160" y1="180" x2="256" y2="140" stroke="white" stroke-width="3" opacity="0.35"/>
  <line x1="352" y1="180" x2="256" y2="140" stroke="white" stroke-width="3" opacity="0.35"/>
  <line x1="160" y1="300" x2="200" y2="340" stroke="white" stroke-width="3" opacity="0.35"/>
  <line x1="352" y1="300" x2="312" y2="340" stroke="white" stroke-width="3" opacity="0.35"/>
  <line x1="200" y1="340" x2="256" y2="240" stroke="white" stroke-width="3" opacity="0.35"/>
  <line x1="312" y1="340" x2="256" y2="240" stroke="white" stroke-width="3" opacity="0.35"/>
  <!-- Graduation cap on top -->
  <polygon points="256,80 196,110 256,140 316,110" fill="white" opacity="0.95"/>
  <line x1="256" y1="110" x2="256" y2="140" stroke="white" stroke-width="4" opacity="0.9"/>
  <rect x="248" y="105" width="16" height="8" rx="2" fill="white" opacity="0.9"/>
  <!-- Tassel -->
  <line x1="316" y1="110" x2="326" y2="140" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <circle cx="326" cy="144" r="6" fill="#fbbf24"/>
  <!-- Bottom text area: "AI" -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="80" fill="white" letter-spacing="4">AI</text>
</svg>
